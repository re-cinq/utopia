# Defaults render a working chart on any Kubernetes cluster; a cluster's file
# under deploy/clusters/ sets hostname, image, sizes and whatever its cloud
# needs. Secret VALUES never live here: each entry under `secrets` names a key
# in a secret store read through External Secrets, or `secrets.external: false`
# leaves the Secrets to you.

# Where the pods run. Either set here, or once for every chart of a release
# under `global`; a value set here wins.
nodeSelector: {}
tolerations: []

image:
  repository: ghcr.io/re-cinq/utopia
  tag: latest
  # A digest pins the bytes; set it and the tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent
  # Name of an image pull secret; empty when the image is public.
  pullSecret: ""

hostname: utopia.example.com

# Single sign-on is the only way in. Password login and open registration stay off.
# Any OpenID Connect issuer works; for Microsoft Entra see deploy/README.md.
oidc:
  issuer: https://accounts.google.com
  allowedDomains: re-cinq.com

# The Google Drive source reuses the OIDC client; it needs Google as the issuer.
googleDrive:
  enabled: false

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 2Gi }

# Uploaded files, the search index and the key cache. One disk, one writer:
# the Deployment recreates rather than rolls.
data:
  size: 20Gi
  # Empty: the cluster's default storage class.
  storageClass: ""

# Extra environment for the app container. Values here are plain strings.
env:
  UTOPIA_DB_MAX_CONNECTIONS: "32"

database:
  # Pinned by digest; the digest wins over the tag.
  image: ghcr.io/cloudnative-pg/postgresql:16-bookworm@sha256:bf0b0ec764b26fbb9136476ed29ad92abdc1277d0465194b8bf420f0116b974d
  size: 80Gi
  # Empty: the cluster's default storage class.
  storageClass: ""
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "4", memory: 8Gi }
  parameters:
    shared_buffers: 2GB
    effective_cache_size: 6GB
    work_mem: 16MB
  # Base backups nightly plus continuous WAL through the barman-cloud plugin.
  # `objectStore` is the `configuration` of a barman ObjectStore, passed through
  # as written (GCS, S3 or Azure Blob); empty: no backups. Example, GCS:
  #   objectStore:
  #     destinationPath: gs://my-bucket/
  #     googleCredentials: { gkeEnvironment: true }
  #     data: { compression: gzip, jobs: 2 }
  #     wal: { compression: gzip, maxParallel: 2 }
  backup:
    objectStore: {}
    # Annotation target for GKE Workload Identity; empty elsewhere.
    serviceAccount: ""
    serverName: utopia-db
    retention: 14d
  # Born with pg_basebackup from another CNPG primary instead of initdb.
  # `host` reaches that primary on 5432; the secrets legacy-db-replication
  # (tls.crt, tls.key of its streaming_replica user) and legacy-db-ca
  # (ca.crt) are copied from its namespace by hand. `replica` keeps streaming
  # until flipped to false, which promotes this cluster. Leave `host` set for
  # the life of the cluster: bootstrap only matters at creation.
  restore:
    host: ""
    replica: true

secrets:
  # false renders no ExternalSecret: the Secrets (utopia-db-credentials,
  # utopia-app-db-credentials, utopia-app, utopia-oauth and the pull secret)
  # must then already exist in the namespace, for a cluster with no secret store.
  external: true
  store: gcp-secret-manager
  dbPassword: lore-utopia-db-password
  appDbPassword: lore-utopia-app-db-password
  secretKey: lore-utopia-secret-key
  oauthClientId: lore-utopia-oauth-client-id
  oauthClientSecret: lore-utopia-oauth-client-secret
  cookieSecret: lore-utopia-cookie-secret
  ghcrPullSecret: lore-ghcr-pull-secret

# The controller must allow request bodies up to 200 MB and long-lived connections.
ingress:
  # Empty: the cluster's default ingress class.
  className: ""
  # cert-manager ClusterIssuer; empty: no cert-manager annotation.
  clusterIssuer: ""
  # true: annotate the host for external-dns.
  externalDns: false
  # false: no tls section, for a host served over plain HTTP.
  tls: true
  # Controller-specific settings, e.g. body size and read timeout.
  annotations: {}

# The app is a single replica on one disk, so a budget of minAvailable 1 blocks
# every voluntary eviction. Turn it on to hold the node-drain for a person.
podDisruptionBudget:
  enabled: false

# Volume-filling alerts, for a cluster that runs the Prometheus operator.
alerts:
  enabled: false

network:
  ingressControllerNamespace: traefik
  cnpgOperatorNamespace: cnpg-system
  # This cluster's Service range, fenced off from the app's egress with the
  # private ranges, so an endpoint typed into the admin page stays outside.
  clusterServicesCidr: 10.0.0.0/8
  # Address of a NodeLocal DNSCache, when the cluster runs one (usually 169.254.20.10/32).
  nodeLocalDnsAddress: ""
  # Web sources may be plain http:// URLs, so egress allows port 80 as well as 443.
  allowPlainHttp: true
  # In-cluster callers allowed to reach the app pod on its port.
  allowFrom: []
  #  - namespace: lore-api
  #    podLabels: { app: lore-api }
