{{- if .Values.database.backup.objectStore }}
# Where utopia-db keeps its base backups and WAL, through the barman-cloud
# plugin. `configuration` is database.backup.objectStore as written, so any
# store the plugin speaks (GCS, S3, Azure Blob) works.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: utopia-db
spec:
  retentionPolicy: {{ .Values.database.backup.retention }}
  configuration:
    {{- toYaml .Values.database.backup.objectStore | nindent 4 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: utopia-db-daily
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster: { name: utopia-db }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
