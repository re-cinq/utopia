{{- $store := .Values.secrets.store }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utopia-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: utopia-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: utopia
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.dbPassword }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utopia-app-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: utopia-app-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: utopia_app
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.appDbPassword }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utopia-app
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: utopia-app
  data:
    - secretKey: secret-key
      remoteRef: { key: {{ .Values.secrets.secretKey }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utopia-oauth
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: utopia-oauth
  data:
    - secretKey: client-id
      remoteRef: { key: {{ .Values.secrets.oauthClientId }} }
    - secretKey: client-secret
      remoteRef: { key: {{ .Values.secrets.oauthClientSecret }} }
    - secretKey: cookie-secret
      remoteRef: { key: {{ .Values.secrets.cookieSecret }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: {{ .Values.image.pullSecret }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef: { key: {{ .Values.secrets.ghcrPullSecret }} }
